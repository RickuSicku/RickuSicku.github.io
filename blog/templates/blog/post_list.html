{% extends "base.html" %}

{% block title %}Blog | My Website{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8">My Blog</h1>
    <div class="space-y-8">
        {% for post in posts %}
            <div class="border-b pb-8">
                <h2 class="text-2xl font-bold mb-2">
                    <a href="#" class="hover:text-blue-600">{{ post.title }}</a>
                </h2>
                <p class="text-gray-500 text-sm mb-4">{{ post.created_at|date:"F d, Y" }}</p>
                <p class="text-gray-700">{{ post.body|truncatewords:30 }}</p>
            </div>
        {% empty %}
            <p>No posts written yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
